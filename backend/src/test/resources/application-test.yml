# Test profile. Every value here is a throwaway test value, none is a real secret.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    # The DB engineer's changelog is the single source of truth for the schema. Tests run it as-is.
    change-log: classpath:db/changelog/db.changelog-master.yaml

aidrama:
  auth:
    jwt-secret: test-only-secret-test-only-secret-0123456789
  storage:
    bucket: test-bucket
    region: us-east-1
    access-key-id: test
    secret-access-key: test
    public-base-url: https://cdn.test.invalid/media
    max-upload-bytes: 1000000
    # Tiny thresholds so the multipart path is exercised without moving real bytes (the fake storage
    # tracks only metadata). Existing tests use SIZE=5000, below the threshold, so they keep taking
    # the single-PUT path; a multipart test declares a size at or above 10000 to split into parts.
    multipart-threshold-bytes: 10000
    multipart-part-bytes: 10000
  cors:
    allowed-origins: http://localhost:3000
  web:
    base-url: http://localhost:3000
