  - include: { file: changes/0005-video-assets.sql,       relativeToChangelogFile: true }
  - include: { file: changes/0006-upload-sessions.sql,    relativeToChangelogFile: true }
  - include: { file: changes/0007-processing-jobs.sql,    relativeToChangelogFile: true }
  - include: { file: changes/0008-video-view-events.sql,  relativeToChangelogFile: true }
  - include: { file: changes/0009-soft-delete-guards.sql, relativeToChangelogFile: true }
  - include: { file: changes/0010-upload-session-asset-kind.sql, relativeToChangelogFile: true }
  - include: { file: changes/0011-trailer-link.sql,       relativeToChangelogFile: true }
